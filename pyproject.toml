[project]
name = "podcast-knowledge-graph-api"
version = "0.1.0"
description = "Standalone API for podcast ingestion, RDF knowledge graphs, SPARQL and evidence-grounded retrieval"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Karam" }]
keywords = ["knowledge-graph", "podcast", "rdf", "owl", "sparql", "rag", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi==0.133.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pyshacl==0.30.1",
  "rdflib==7.4.0",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.urls]
Homepage = "https://github.com/karam-ai/knowledge-base"
Repository = "https://github.com/karam-ai/knowledge-base.git"
Issues = "https://github.com/karam-ai/knowledge-base/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
